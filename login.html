<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontisto/3.0.4/css/fontisto.min.css" integrity="sha512-BK7gVjtpI03rzn2PXIJKa2Eq2GehYBWEzEFt0L2rXtjEQ4EYuYulpnrDCclBv7dzfD0mJ0M7jYNE63FVMKVa7g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="login-form" action="#" method="post">
            <div class="cnt-phone">
                <button type="button" id="phone-btn" class="auth-button phone-btn">
                    <span class="btn-icon"><i class="fi fi-rr-phone-call"></i></span>
                    <span class="btn-label">Continue with phone</span>
                </button>
            </div>
            <div class="cnt-google">
                <button type="button" id="google-btn" class="auth-button google-btn">
                    <span class="btn-icon google-icon"><i class="fi fi-brands-google"></i></span>
                    <span class="btn-label">Continue with Google</span>
                </button>
            </div>
            <div class="cnt-apple">
                <button type="button" id="apple-btn" class="auth-button apple-btn">
                    <span class="btn-icon"><i class="fi fi-brands-apple"></i></span>
                    <span class="btn-label">Continue with Apple</span>
                </button>
            </div>

            <div class="divider">
                <hr>
                <span>or</span>
                <hr>
            </div>

            <label for="username">Email or username</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" id="login-btn">Continue</button>
        </form>
    </div>
    <script src="login.js"></script>
</body>
