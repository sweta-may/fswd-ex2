<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="login-form" action="#" method="post">
            <div class="cnt-phone">
                <button type="button" id="phone-btn">Continue with phone</button>
            </div>
            <div class="cnt-google">
                <button type="button" id="google-btn">Continue with Google</button>
            </div>
            <div class="cnt-apple">
                <button type="button" id="apple-btn">Continue with Apple</button>
            </div>

            <div class="divider">
                <hr>
                <span>or</span>
                <hr>
            </div>

            <label for="username">Email or username</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" id="login-btn">Continue</button>
        </form>
    </div>
    <script src="login.js"></script>
</body>
