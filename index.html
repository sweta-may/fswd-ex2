<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontisto/3.0.4/css/fontisto.min.css" integrity="sha512-BK7gVjtpI03rzn2PXIJKa2Eq2GehYBWEzEFt0L2rXtjEQ4EYuYulpnrDCclBv7dzfD0mJ0M7jYNE63FVMKVa7g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="index-wrapper">
    <main class="index-main">
      <section class="top-search">
        <div class="search-input-wrapper">
          <i class="fi fi-br-search search-icon"></i>
          <input class="search-input" type="search" placeholder="Search">
        </div>
      </section>

      <section class="tabs">
        <div class="tab-item active">For you</div>
        <div class="tab-item">Following</div>
      </section>

      <section class="feed-card">
        <h2>Welcome back</h2>
        <p>Here is your home feed. Tap the new post button to share something with your followers.</p>
      </section>
    </main>

    <footer class="index-footer">
      <button class="footer-btn"><i class="fi fi-rr-phone-call"></i></button>
      <button class="footer-btn"><i class="fi fi-rr-bell"></i></button>
      <button class="footer-btn new-post"><i class="fi fi-rr-phone-call"></i></button>
      <button class="footer-btn"><i class="fi fi-rr-paper-plane"></i></button>
      <button class="footer-btn"><i class="fi fi-rr-user"></i></button>
    </footer>
  </div>
  <script src="script.js"></script> 
</body>
</html>
